# Nginx site for a Deployment Maintainer agent (the API on :3000). Install it
# on every server you manage.
#
# Install as /etc/nginx/sites-available/deployment-maintainer, replace
# YOUR_SERVER_DOMAIN with this server's domain, symlink into sites-enabled,
# then run `sudo certbot --nginx -d YOUR_SERVER_DOMAIN`. Certbot rewrites this
# file to add a `listen 443 ssl;` server block and an HTTP -> HTTPS redirect.
# Don't add TLS directives by hand: this file is intentionally HTTP-only until
# certbot runs.
#
# This host serves no UI. The dashboard lives on the control plane's domain and
# calls this host's /api/ with a bearer secret. `/` is a 404 on purpose.
#
# Per-app routes (written by the agent to /etc/nginx/deployer-apps/*.conf)
# always win over the catch-all `location /` below: nginx picks the *longest
# matching prefix*, regardless of the order locations appear in the file, so a
# request to /my-app/ matches the per-app `location /my-app/ { ... }` even
# though it's declared after `location /` via the `include` at the bottom.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_SERVER_DOMAIN;

    # Config import / app-create payloads are small JSON; 2m is generous headroom.
    client_max_body_size 2m;

    location = / {
        return 404;
    }

    # Anything that isn't an API call, the handshake or a per-app route.
    location / {
        return 404;
    }

    # Handshake: the control plane calls this before it has a secret to send.
    location = /deployment-manager {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The agent API.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Live deploy log streaming (SSE) needs buffering fully disabled, or nginx
    # will hold the response until it fills a buffer and the log will appear
    # to "hang" instead of streaming line by line.
    location /api/deployments {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # One location file per deployed app, written by the agent's nginx step.
    # Must be included *inside* this server block (not at the http level) since
    # each file is just bare `location { ... }` blocks.
    include /etc/nginx/deployer-apps/*.conf;
}
