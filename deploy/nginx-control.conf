# Nginx site for the Deployment Maintainer control plane (the dashboard on
# :3100). Install it only on the server that runs the control plane.
#
# Install as /etc/nginx/sites-available/deployment-control, replace
# YOUR_CONTROL_DOMAIN with the dashboard's domain, symlink into sites-enabled,
# then run `sudo certbot --nginx -d YOUR_CONTROL_DOMAIN`. Certbot rewrites this
# file to add a `listen 443 ssl;` server block and an HTTP -> HTTPS redirect.
# Don't add TLS directives by hand: this file is intentionally HTTP-only until
# certbot runs.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_CONTROL_DOMAIN;

    # Config import and app-create payloads pass through here; 2m matches the
    # control plane's JSON body limit.
    client_max_body_size 2m;

    # The dashboard UI plus the control plane API.
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything proxied to an agent, including live deploy logs (SSE). SSE
    # needs buffering fully disabled, or nginx will hold the stream until it
    # fills a buffer and the log will appear to "hang".
    location /api/servers {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
